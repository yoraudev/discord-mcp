name: Release

on:
  push:
    branches: [main]
    paths:
      - src/**
      - package.json
      - package-lock.json
      - tsconfig.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compute version
        id: version
        run: node tools/release-version.mjs
      - run: npm run check
      - run: npm run package:check
      - name: Package
        run: |
          mkdir -p release
          npm pack --pack-destination release
          cd release
          sha256sum *.tgz > SHA256SUMS
      - name: Publish release
        run: gh release create "v${VERSION}" release/* --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
